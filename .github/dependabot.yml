version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: UTC
    target-branch: deps
    groups:
      python:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: UTC
    target-branch: deps
    groups:
      actions:
        patterns:
          - "*"
