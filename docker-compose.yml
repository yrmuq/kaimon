services:

  kaimon:
    container_name: kaimon
    image: ghcr.io/yrmuq/kaimon:latest
    build: .
    ports:
      - ${KAIMON}:8080
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "55m"
        max-file: "1"
    restart: unless-stopped
    networks:
      - homelab

networks:
  homelab:
    external: true
