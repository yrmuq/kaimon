<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaimon</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div class="cluster left">
      <button type="button" id="open" data-i18n="3"></button>
      <input id="file" type="file" accept=".txt,text/plain">
      <label class="slider">
        <span data-i18n="31"></span>
        <input id="semantic" type="range" min="50" max="95" step="1" value="72">
        <span id="semantic-value">72%</span>
      </label>
      <label class="slider">
        <span data-i18n="32"></span>
        <input id="lexical" type="range" min="50" max="95" step="1" value="76">
        <span id="lexical-value">76%</span>
      </label>
      <span id="filename"></span>
    </div>
    <div class="pair-nav">
      <button type="button" id="back" class="next" data-i18n="36" disabled></button>
      <button type="button" id="next" class="next" data-i18n="2" disabled></button>
    </div>
    <div class="cluster right">
      <button type="button" id="save" data-i18n="29" disabled></button>
      <button type="button" id="download" data-i18n="4" disabled></button>
      <label>
        <span data-i18n="5"></span>
        <select id="lang">
          <option value="en"></option>
          <option value="ru"></option>
        </select>
      </label>
      <label>
        <span data-i18n="6"></span>
        <select id="theme">
          <option value="light"></option>
          <option value="dark"></option>
          <option value="system"></option>
        </select>
      </label>
    </div>
  </header>
  <div class="workspace">
    <aside id="files">
      <p class="files-label" data-i18n="27"></p>
      <ul id="file-list"></ul>
      <p id="files-empty" class="hint" data-i18n="28" hidden></p>
    </aside>
    <div class="main">
      <p id="status" aria-live="polite"></p>
      <div id="progress" hidden><span></span></div>
      <p id="error" role="alert" hidden></p>
      <div class="panes">
      <div class="editor" id="left-editor">
        <pre aria-hidden="true"></pre>
        <textarea spellcheck="false" autocomplete="off" autocapitalize="off" disabled></textarea>
      </div>
      <div class="editor" id="right-editor">
        <pre aria-hidden="true"></pre>
        <textarea spellcheck="false" autocomplete="off" autocapitalize="off" disabled></textarea>
      </div>
      <div id="drop">
        <p data-i18n="12"></p>
        <p class="hint" data-i18n="13"></p>
      </div>
      </div>
    </div>
    <div id="resume" hidden>
      <p data-i18n="33"></p>
      <div class="cluster">
        <button type="button" id="resume-yes" data-i18n="34"></button>
        <button type="button" id="resume-no" data-i18n="35"></button>
      </div>
    </div>
  </div>
  <script type="module" src="/static/app.mjs"></script>
</body>
</html>
